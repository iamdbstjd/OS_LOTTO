{% extends "base.html" %}

{% block title %}로그인 | Lotto 6/45{% endblock %}

{% block content %}
<section class="auth-panel">
    <div class="auth-brand">
        <span class="brand-ball">6/45</span>
        <p class="eyebrow">Member</p>
    </div>
    <h1>로그인</h1>
    <form method="post" class="form-stack">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <label>
            아이디
            {{ form.username }}
            {{ form.username.errors }}
        </label>
        <label>
            비밀번호
            {{ form.password }}
            {{ form.password.errors }}
        </label>
        <button class="primary" type="submit">로그인</button>
    </form>
    <p class="auth-link"><a href="{% url 'signup' %}">회원가입</a></p>
</section>
{% endblock %}
